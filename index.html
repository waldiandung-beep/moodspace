<!DOCTYPE html>
<html>

<head>
  <title>MoodSpace ULTRA+</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      padding-top: 40px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      padding: 25px;
      margin: 20px auto;
      width: 330px;
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      transition: 0.4s;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.03);
    }

    button {
      padding: 12px 16px;
      margin: 6px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      background: rgba(255,255,255,0.2);
      color: white;
      transition: 0.3s;
    }

    button:hover {
      background: white;
      color: black;
      transform: scale(1.1);
    }

    textarea {
      width: 90%;
      height: 80px;
      border-radius: 15px;
      border: none;
      padding: 10px;
      margin-top: 10px;
    }

    #quote {
      margin-top: 10px;
      font-style: italic;
    }
  </style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="container">

  <h1>🌊 MoodSpace ULTRA+</h1>
  <p>Feel • Relax • Focus ✨</p>

  <div class="card">
    <h3>Mood</h3>
    <button onclick="setMood('tenang')">😌</button>
    <button onclick="setMood('sedih')">😢</button>
    <button onclick="setMood('fokus')">🎧</button>
    <p id="quote">Pilih mood dulu...</p>
  </div>

  <div class="card">
    <h3>Sound</h3>
    <button onclick="playSound()">▶️</button>
    <button onclick="pauseSound()">⏸️</button>
    <button onclick="stopSound()">⏹️</button>
  </div>

  <div class="card">
    <h3>Journal</h3>
    <textarea id="note" placeholder="Tulis perasaan kamu..."></textarea><br>
    <button onclick="saveNote()">💾 Simpan</button>
  </div>

</div>

<audio id="sound" loop></audio>

<script>

// PARTICLE BACKGROUND
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 3,
    speedX: Math.random() - 0.5,
    speedY: Math.random() - 0.5
  });
}

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p => {
    p.x += p.speedX;
    p.y += p.speedY;

    if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
    if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.fill();
  });

  requestAnimationFrame(animate);
}

animate();

// AUTO LOAD
window.onload = () => {
  let savedMood = localStorage.getItem("mood");
  let savedNote = localStorage.getItem("note");

  if (savedMood) setMood(savedMood);
  if (savedNote) document.getElementById("note").value = savedNote;
};

// QUOTES
let quotes = {
  tenang: [
    "Tenang... semuanya akan baik 🌊",
    "Nikmati momen ini 😌",
    "Hidup tidak perlu terburu",
    "Damai itu indah",
    "Tarik napas, lepaskan beban",
    "Kamu aman di sini",
    "Pelan-pelan saja",
    "Biarkan semua mengalir",
    "Ketenangan adalah kekuatan",
    "Diam juga berarti"
  ],
  sedih: [
    "Kamu tidak sendiri 💙",
    "Tidak apa-apa merasa sedih",
    "Hari ini berat, tapi kamu kuat",
    "Semua akan berlalu",
    "Istirahatlah sejenak",
    "Kamu hebat sudah bertahan",
    "Besok lebih baik",
    "Pelan-pelan sembuh",
    "Air mata itu wajar",
    "Kamu berharga"
  ],
  fokus: [
    "Fokus, kamu pasti bisa 🎧",
    "Mulai sekarang",
    "Jangan tunda",
    "Disiplin adalah kunci",
    "Kerja keras hari ini",
    "Langkah kecil berarti",
    "Tetap konsisten",
    "Kamu hampir sampai",
    "Jangan menyerah",
    "Gas terus 🔥"
  ]
};

let currentSound = "";

function setMood(mood) {
  let sounds = {
    tenang: "ocean.mp3",
    sedih: "rain.mp3",
    fokus: "focus.mp3"
  };

  localStorage.setItem("mood", mood);

  let random = quotes[mood][Math.floor(Math.random()*quotes[mood].length)];
  document.getElementById("quote").innerText = random;

  currentSound = sounds[mood];
  playSound();
}

// AUDIO
function playSound() {
  let audio = document.getElementById("sound");
  audio.src = currentSound;
  audio.volume = 0.5;
  audio.play();
}

function pauseSound() {
  document.getElementById("sound").pause();
}

function stopSound() {
  let audio = document.getElementById("sound");
  audio.pause();
  audio.currentTime = 0;
}

// SAVE NOTE
function saveNote() {
  let text = document.getElementById("note").value;
  localStorage.setItem("note", text);
  alert("Tersimpan 💙");
}

</script>

</body>
</html>
