<!DOCTYPE html>
<html>

<head>
  <title>MoodSpace Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      transition: 0.8s;
    }

    .dark {
      background: linear-gradient(135deg, #1e1e1e, #000);
    }

    .container {
      padding-top: 40px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      padding: 25px;
      margin: 20px auto;
      width: 320px;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    button {
      padding: 12px;
      margin: 6px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    #timer {
      font-size: 35px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🌊 MoodSpace PRO</h1>

  <button onclick="toggleDark()">🌙 Dark Mode</button>

  <div class="card">
    <h3>Mood</h3>
    <button onclick="setMood('tenang')">😌</button>
    <button onclick="setMood('sedih')">😢</button>
    <button onclick="setMood('fokus')">🎧</button>
  </div>

  <div class="card">
    <h3>Sound Control</h3>
    <button onclick="playSound()">▶️ Play</button>
    <button onclick="pauseSound()">⏸️ Pause</button>
    <button onclick="stopSound()">⏹️ Stop</button>
  </div>

  <div class="card">
    <h3>Timer</h3>
    <div id="timer">25:00</div>
    <button onclick="startTimer()">Start</button>
  </div>

</div>

<audio id="sound" loop></audio>

<script>
let currentSound = "";

function setMood(mood) {
  let sounds = {
    tenang: "ocean.mp3",
    sedih: "rain.mp3",
    fokus: "focus.mp3"
  };

  currentSound = sounds[mood];
  playSound();
}

function playSound() {
  let audio = document.getElementById("sound");
  audio.src = currentSound;
  audio.volume = 0.5;
  audio.play();
}

function pauseSound() {
  document.getElementById("sound").pause();
}

function stopSound() {
  let audio = document.getElementById("sound");
  audio.pause();
  audio.currentTime = 0;
}

function toggleDark() {
  document.body.classList.toggle("dark");
}

// TIMER
let time = 1500;
function startTimer() {
  let interval = setInterval(() => {
    let min = Math.floor(time / 60);
    let sec = time % 60;

    document.getElementById("timer").innerText =
      `${min}:${sec < 10 ? '0' : ''}${sec}`;

    time--;
    if (time < 0) clearInterval(interval);
  }, 1000);
}
</script>

</body>
</html>
