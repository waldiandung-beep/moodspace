<!DOCTYPE html>
<html>

<head>
  <title>MoodSpace ULTRA FINAL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      padding-top: 40px;
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      padding: 25px;
      margin: 20px auto;
      width: 330px;
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      transition: 0.4s;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.03);
    }

    button {
      padding: 12px 16px;
      margin: 6px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      background: rgba(255,255,255,0.2);
      color: white;
      transition: 0.3s;
    }

    button:hover {
      background: white;
      color: black;
      transform: scale(1.1);
    }

    textarea {
      width: 90%;
      height: 80px;
      border-radius: 15px;
      border: none;
      padding: 10px;
      margin-top: 10px;
    }

    #quote {
      margin-top: 10px;
      font-style: italic;
    }
  </style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="container">

  <h1>🌊 MoodSpace ULTRA FINAL</h1>

  <div class="card">
    <h3>Mood</h3>
    <button onclick="setMood('tenang')">😌</button>
    <button onclick="setMood('sedih')">😢</button>
    <button onclick="setMood('fokus')">🎧</button>
    <p id="quote">Pilih mood dulu...</p>
  </div>

  <div class="card">
    <h3>Sound</h3>
    <button onclick="playSound()">▶️</button>
    <button onclick="pauseSound()">⏸️</button>
    <button onclick="stopSound()">⏹️</button>
  </div>

  <div class="card">
    <h3>Journal</h3>
    <textarea id="note"></textarea><br>
    <button onclick="saveNote()">💾 Simpan</button>
  </div>

</div>

<audio id="sound" loop></audio>

<script>

// PARTICLES
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    size: Math.random()*3,
    dx: Math.random()-0.5,
    dy: Math.random()-0.5
  });
}

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.x+=p.dx;
    p.y+=p.dy;
    if(p.x<0||p.x>canvas.width)p.dx*=-1;
    if(p.y<0||p.y>canvas.height)p.dy*=-1;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,0.5)";
    ctx.fill();
  });
  requestAnimationFrame(animate);
}
animate();

// QUOTES
let quotes = {
  tenang:["Tenang... semuanya akan baik 🌊","Nikmati momen ini","Pelan-pelan saja","Kamu aman","Damai itu indah","Tarik napas","Hidup tidak buru-buru","Biarkan mengalir","Ketenangan itu kuat","Diam juga berarti"],
  sedih:["Kamu tidak sendiri 💙","Tidak apa-apa sedih","Kamu kuat","Hari ini berat","Besok lebih baik","Pelan sembuh","Istirahatlah","Air mata wajar","Kamu berharga","Semua berlalu"],
  fokus:["Fokus, kamu bisa 🎧","Mulai sekarang","Jangan tunda","Disiplin kunci","Kerja keras","Langkah kecil","Konsisten","Jangan menyerah","Gas terus","Dekat tujuan"]
};

let currentSound="";
let audio=document.getElementById("sound");

// FIX SOUND (NO BUG + FADE)
function setMood(mood){
  let sounds={
    tenang:"ocean.mp3",
    sedih:"rain.mp3",
    fokus:"focus.mp3"
  };

  localStorage.setItem("mood",mood);

  let q=quotes[mood][Math.floor(Math.random()*quotes[mood].length)];
  document.getElementById("quote").innerText=q;

  currentSound=sounds[mood];

  audio.pause();
  audio.currentTime=0;
  audio.src=currentSound;

  audio.volume=0;
  audio.play().then(()=>{
    let vol=0;
    let fade=setInterval(()=>{
      if(vol<0.5){
        vol+=0.05;
        audio.volume=vol;
      }else{
        clearInterval(fade);
      }
    },100);
  }).catch(()=>{});
}

// CONTROL
function playSound(){ audio.play(); }
function pauseSound(){ audio.pause(); }
function stopSound(){ audio.pause(); audio.currentTime=0; }

// AUTO QUOTE
setInterval(()=>{
  let mood=localStorage.getItem("mood");
  if(!mood)return;
  let q=quotes[mood][Math.floor(Math.random()*quotes[mood].length)];
  document.getElementById("quote").innerText=q;
},5000);

// SAVE NOTE
function saveNote(){
  localStorage.setItem("note",document.getElementById("note").value);
  alert("Tersimpan 💙");
}

// LOAD
window.onload=()=>{
  let m=localStorage.getItem("mood");
  let n=localStorage.getItem("note");
  if(m)setMood(m);
  if(n)document.getElementById("note").value=n;
};

</script>

</body>
</html>
